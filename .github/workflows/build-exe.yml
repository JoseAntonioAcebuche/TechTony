name: Build FileArranger EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "fileorganizer.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name FileArranger fileorganizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileArranger-exe
          path: dist/FileArranger.exe
