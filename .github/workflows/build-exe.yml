name: Build FileArranger EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "fileorganizer.py"
      - ".github/workflows/build-exe.yml"

jobs:
  # Step 1: grab only fileorganizer.py on Linux. The repo has a folder name that
  # Windows git rejects (trailing space), so Windows can't check out the repo.
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (only fileorganizer.py)
        uses: actions/checkout@v4
        with:
          sparse-checkout: fileorganizer.py
          sparse-checkout-cone-mode: false

      - name: Share the source file
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: fileorganizer.py

  # Step 2: build the Windows exe from that file
  build:
    needs: fetch
    runs-on: windows-latest
    steps:
      - name: Get the source file
        uses: actions/download-artifact@v4
        with:
          name: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name FileArranger fileorganizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileArranger-exe
          path: dist/FileArranger.exe
